<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mijn Dashboard</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">
      <div class="brand-mark"><span></span><span></span><span></span><span></span></div>
      <div><h1>Mijn Dashboard</h1><p>Tools &amp; Websites</p></div>
    </div>
    <div class="search"><input id="search" type="search" placeholder="Zoeken..."></div>
  </div>
</header>
<main>
  <section class="section" id="toolsSection">
    <div class="section-head"><h2>Tools</h2><span class="count" id="toolsCount"></span></div>
    <div class="grid" id="toolsGrid"></div>
  </section>
  <section class="section" id="websitesSection">
    <div class="section-head"><h2>Websites</h2><span class="count" id="websitesCount"></span></div>
    <div class="grid" id="websitesGrid"></div>
  </section>
  <div id="noResults" class="no-results hidden">Geen resultaten gevonden.</div>
</main>
<script src="js/app.js"></script>
</body>
</html>
